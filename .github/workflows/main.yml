20. Scam Risk

### AIRDROP RATING

🟢 HIGH CONFIDENCE:
Official announcement, वास्तविक Product, मजबूत Community और स्पष्ट Reward Rules।

🟡 MEDIUM:
Project वास्तविक है और Community अच्छी है, लेकिन Token/Airdrop अभी Confirm नहीं।

🟠 SPECULATIVE:
संभावित Reward, लेकिन Official पुष्टि नहीं।

🔴 REJECT:
Fake Accounts, नकली Engagement, संदिग्ध Links, Deposit, Seed Phrase, Malicious Wallet Approval या Scam संकेत।

### COMMUNITY QUALITY SCORE

केवल Followers देखकर मजबूत Community मत मानना।

इनका विश्लेषण करो:
- Followers
- वास्तविक Posts
- Comments की गुणवत्ता
- लगातार Activity
- Community Questions/Answers
- Official Replies
- Organic Engagement
- Community Growth
- Bot/Fake Engagement के संकेत

जहाँ आँकड़े उपलब्ध नहीं हों वहाँ अनुमान मत लगाना।

### IMPORTANT CRYPTO RULE

मुझे ऐसे Free Projects खोजो जिनमें भविष्य में Reward मिलने की संभावना हो, चाहे Reward छोटा हो या बड़ा।

लेकिन:
- भविष्य के पैसे की Guarantee मत देना।
- Token Confirmed नहीं है तो Confirmed मत लिखना।
- Points को पैसे मत बताना।
- संभावित Token Value को वास्तविक Income मत बताना।
- Investment या Deposit वाले Tasks को Free नहीं कहना।
- Seed Phrase कभी नहीं माँगना।
- Wallet Drain और Malicious Approvals से सावधान करना।
- हर Project का Official Link और Original X Post देना।
- Community मजबूत होने के साथ Project की वास्तविकता भी जाँचो।

हर रिपोर्ट में सबसे अच्छे Airdrops को प्राथमिकता दो और बताओ कि कौन-सा आज करना चाहिए, कौन-सा केवल निगरानी में रखना चाहिए और किससे बचना चाहिए।
