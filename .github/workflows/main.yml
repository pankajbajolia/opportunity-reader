name: Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Search GitHub and Reddit
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, os, datetime

          token = os.environ["BOT_TOKEN"]
          chat = os.environ["CHAT_ID"]
          today = datetime.date.today()
          start = today - datetime.timedelta(days=7)

          found = {}

          queries = [
              "AI video",
              "AI agent",
              "open source AI",
              "video editing AI",
              "automation AI"
          ]

          for q in queries:
              search = q + " created:" + str(start) + ".." + str(today)
              url = "https://api.github.com/search/repositories?q=" + urllib.parse.quote(search) + "&sort=stars&order=desc&per_page=3"
              req = urllib.request.Request(url, headers={"User-Agent": "OpportunityRadar"})
              try:
                  data = json.loads(urllib.request.urlopen(req, timeout=20).read())
                  for r in data.get("items", []):
                      found[r["html_url"]] = {
                          "name": r["full_name"],
                          "stars": r["stargazers_count"],
                          "desc": r.get("description") or "",
                          "url": r["html_url"]
                      }
              except Exception as e:
                  print("GitHub error:", e)

          reddit_queries = [
              "free AI tools",
              "AI video tools",
              "make money online",
              "AI automation"
          ]

          for q in reddit_queries:
              url = "https://www.reddit.com/search.json?q=" + urllib.parse.quote(q) + "&sort=new&limit=5"
              req = urllib.request.Request(url, headers={"User-Agent": "OpportunityRadar/1.0"})
              try:
                  data = json.loads(urllib.request.urlopen(req, timeout=20).read())
                  for p in data["data"]["children"]:
                      r = p["data"]
                      link = "https://www.reddit.com" + r["permalink"]
                      found[link] = {
                          "name": "Reddit: " + r["title"],
                          "stars": r.get("score", 0),
                          "desc": r.get("selftext", "")[:250],
                          "url": link
                      }
              except Exception as e:
                  print("Reddit error:", e)

          items = sorted(found.values(), key=lambda x: x["stars"], reverse=True)[:12]

          msg = "🔎 OPPORTUNITY RADAR\n\nGitHub + Reddit की नई खोज:\n\n"

          for r in items:
              msg += "📌 " + r["name"] + "\n"
              msg += "⭐ Popularity: " + str(r["stars"]) + "\n"
              msg += r["desc"][:250] + "\n"
              msg += r["url"] + "\n\n"

          if not items:
              msg = "इस बार नई चीजें नहीं मिलीं।"

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          payload = json.dumps({"chat_id": chat, "text": msg[:4000]}).encode()
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req).read().decode())
          PY
