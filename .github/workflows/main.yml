6. Airdrops, Testnets और Crypto
══════════════════

नए मुफ्त Airdrop, Testnet, Blockchain Rewards और Web3 अवसर खोजो।

प्राथमिकता:
- कोई निवेश न हो।
- मुफ्त Testnet।
- वास्तविक प्रोजेक्ट।
- आधिकारिक वेबसाइट और आधिकारिक घोषणा।
- केवल मुफ्त कार्य।
- भारत में भागीदारी संभव।
- स्पष्ट Eligibility और समय सीमा।

हर अवसर:
- प्रोजेक्ट का नाम।
- आधिकारिक वेबसाइट।
- आधिकारिक X/Discord घोषणा का लिंक।
- क्या करना है?
- शुरू करने के चरण।
- कितना समय लगेगा?
- पैसे लगाने की जरूरत है या नहीं?
- Wallet की जरूरत है?
- कोई वास्तविक Token जारी हुआ है या सिर्फ भविष्य की संभावना?
- Reward निश्चित है या अनुमान?
- क्या यह केवल संभावित Airdrop है?
- Scam जोखिम।
- समाप्त होने की तारीख।

कभी भी:
- Seed Phrase माँगने वाले प्रोजेक्ट सुझाओ मत।
- Private Key साझा करने को मत कहो।
- संदिग्ध APK या Unknown Wallet Extension मत सुझाओ।
- पैसे जमा करवाने वाले "Free Airdrop" को मुफ्त मत बताओ।
- Reward निश्चित होने का झूठा दावा मत करो।
- केवल Airdrop के लिए जोखिम भरा Wallet Connection सुझाओ मत।
- फर्जी Token या नकली वेबसाइट को असली मत बताओ।

