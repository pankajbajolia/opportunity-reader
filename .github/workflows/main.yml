name: Opportunity Radar

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search public sources and send Telegram report
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          import datetime, email.utils, html, re, time, base64

          TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT = os.environ.get("CHAT_ID", "")
          if not TOKEN or not CHAT:
              raise RuntimeError("Telegram secrets missing: BOT_TOKEN or CHAT_ID")

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          since = now.date() - datetime.timedelta(days=14)
          errors, gh, hn, rss = [], {}, {}, {}

          def fetch(url, headers=None, timeout=25):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"OpportunityRadar/1.0"})
              return urllib.request.urlopen(req, timeout=timeout).read()

          # Translate source text into simple Hindi (fallback keeps original if translation fails).
          translation_cache = {}
          translation_calls = 0
          def clean(s):
              return re.sub(r"\s+", " ", str(s or "")).strip()

          def hi(text):
              global translation_calls
              text = clean(text)
              if not text:
                  return "जानकारी उपलब्ध नहीं"
              if text in translation_cache:
                  return translation_cache[text]
              if translation_calls >= 35:
                  return text
              translation_calls += 1
              try:
                  url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode({
                      "client":"gtx", "sl":"auto", "tl":"hi", "dt":"t", "q":text[:900]
                  })
                  data = json.loads(fetch(url, timeout=8))
                  translated = "".join(part[0] for part in data[0] if part and part[0])
                  translated = clean(translated) or text
              except Exception:
                  translated = text
              translation_cache[text] = translated
              return translated

          def project_use(text):
              t = text.lower()
              if any(k in t for k in ["clip", "shorts", "video editing", "video editor"]):
                  return ("🎯 काम: लंबी वीडियो से छोटे क्लिप/Shorts बनाने या वीडियो एडिटिंग में मदद कर सकता है।",
                          "🚀 शुरू करें: लिंक खोलें → README/Installation पढ़ें → Demo उपलब्ध हो तो पहले आज़माएँ → फिर अपनी वीडियो पर टेस्ट करें।",
                          "💰 कमाई: वीडियो क्लिप/एडिटिंग सेवा देकर ग्राहक मिल सकते हैं; कमाई निश्चित नहीं।")
              if any(k in t for k in ["cartoon", "animation", "blender", "3d"]):
                  return ("🎯 काम: कार्टून, एनीमेशन या 3D सामग्री बनाने के काम आ सकता है।",
                          "🚀 शुरू करें: लिंक खोलें → आवश्यक Software और Hardware जाँचें → Demo/README के अनुसार चलाएँ।",
                          "💰 कमाई: एनीमेशन/3D सामग्री बनाकर सेवा दे सकते हैं; कमाई निश्चित नहीं।")
              if any(k in t for k in ["agent", "mcp", "automation", "workflow"]):
                  return ("🎯 काम: AI से काम करवाने, टूल जोड़ने या प्रक्रिया स्वचालित करने में उपयोग हो सकता है।",
                          "🚀 शुरू करें: लिंक खोलें → आवश्यक AI/API और Software जाँचें → पहले छोटे Demo से टेस्ट करें।",
                          "💰 कमाई: व्यवसायों के लिए Automation सेटअप/सेवा दे सकते हैं; कमाई निश्चित नहीं।")
              if any(k in t for k in ["phone", "android", "mobile"]):
                  return ("🎯 काम: Android फोन को दूसरे काम या नियंत्रण के लिए उपयोग करने में मदद कर सकता है।",
                          "🚀 शुरू करें: लिंक खोलें → फोन और PC की Compatibility जाँचें → निर्देशों के अनुसार जोड़ें।",
                          "💰 कमाई: सीधे कमाई का प्रमाण नहीं; उपयोगी सेटअप को सेवा के रूप में देना संभव हो सकता है।")
              return ("🎯 काम: इसका उपयोग विवरण और Demo देखकर तय करें; केवल नाम से उपयोग पक्का नहीं है।",
                      "🚀 शुरू करें: लिंक खोलें → README/Installation और Demo जाँचें → अपनी जरूरत के अनुसार टेस्ट करें।",
                      "💰 कमाई: सीधे कमाई की पुष्टि नहीं; सेवा या काम में उपयोग होने पर अवसर बन सकता है।")

          # GitHub repository search (public API; unauthenticated rate limit applies)
          gh_queries = ["AI video tools", "AI video clipping", "open source AI agent", "AI cartoon video", "AI automation"]
          for q in gh_queries:
              try:
                  query = q + " created:" + str(since) + ".." + str(now.date())
                  url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode({"q":query,"sort":"stars","order":"desc","per_page":5})
                  data = json.loads(fetch(url, {"User-Agent":"OpportunityRadar","Accept":"application/vnd.github+json"}))
                  for r in data.get("items", []):
                      link = r.get("html_url", "")
                      desc = (r.get("description") or "").strip()
                      txt = (r.get("full_name","") + " " + desc).lower()
                      if any(w in txt for w in ["crack", "keygen", "pirated", "torrent", "fake download"]):
                          continue
                      lic = (r.get("license") or {}).get("spdx_id", "Not specified")
                      gh[link] = {"name":r.get("full_name","?"),"stars":r.get("stargazers_count",0),"desc":desc,"url":link,"date":(r.get("created_at","")[:10]),"lang":r.get("language") or "Unknown","license":lic}
              except Exception as e:
                  errors.append("GitHub search: " + str(e)[:130])

          # Hacker News recent search
          for q in ["AI video", "AI tools", "AI agent", "open source AI", "video clipping"]:
              try:
                  url = "https://hn.algolia.com/api/v1/search_by_date?" + urllib.parse.urlencode({"query":q,"tags":"story","numericFilters":"created_at_i>" + str(int(datetime.datetime.combine(since,datetime.time(),tzinfo=IST).timestamp())),"hitsPerPage":10})
                  data = json.loads(fetch(url))
                  for h in data.get("hits", []):
                      title = h.get("title") or ""
                      if not title: continue
                      link = h.get("url") or ("https://news.ycombinator.com/item?id=" + h.get("objectID",""))
                      hn[h.get("objectID",link)] = {"title":title,"points":h.get("points") or 0,"comments":h.get("num_comments") or 0,"url":link,"discussion":"https://news.ycombinator.com/item?id=" + h.get("objectID","")}
              except Exception as e:
                  errors.append("Hacker News: " + str(e)[:130])

          # Google News public RSS queries. Headlines are leads, not verified claims.
          feeds = {
              "🤖 AI TOOLS / PROJECTS":"new free AI tools OR open source AI project",
              "💵 ONLINE EARNING / DOLLAR WORK":"remote AI training jobs India OR Hindi data annotation jobs OR freelance remote work",
              "🪙 CRYPTO AIRDROPS / TESTNET":"crypto airdrop testnet points rewards official",
              "📱 SOCIAL / REELS TRENDS":"Facebook Reels trends OR Instagram Reels trends OR YouTube Shorts trends",
              "🏪 BUSINESS IDEAS INDIA":"AI services small business India OR online business opportunities India",
              "🌐 PUBLIC COMMUNITY MENTIONS":"site:reddit.com AI tool launch OR site:x.com crypto airdrop testnet"
          }
          for category, q in feeds.items():
              try:
                  params = {"q":q,"hl":"en-IN","gl":"IN","ceid":"IN:en"}
                  url = "https://news.google.com/rss/search?" + urllib.parse.urlencode(params)
                  root = ET.fromstring(fetch(url))
                  entries=[]
                  for item in root.findall(".//item"):
                      title = html.unescape(re.sub("<[^>]+>","",item.findtext("title", ""))).strip()
                      link = item.findtext("link", "").strip()
                      pub = item.findtext("pubDate", "")
                      if pub:
                          try:
                              pub_dt = email.utils.parsedate_to_datetime(pub)
                              if pub_dt.date() < since:
                                  continue
                          except Exception:
                              pass
                      desc = html.unescape(re.sub("<[^>]+>"," ",item.findtext("description", ""))).strip()
                      if title and link:
                          entries.append({"title":title,"url":link,"date":pub,"desc":desc[:240]})
                  rss[category]=entries[:5]
              except Exception as e:
                  errors.append(category + ": " + str(e)[:130])

          # Simple RAM guidance based on project type/description. This is a rough estimate, not source-verified.
          def ram_hint(text):
              t=text.lower()
              if any(k in t for k in ["llm", "local model", "language model", "stable diffusion", "generative video", "video generation", "training model"]):
                  return "🧠 RAM: अनुमान 16GB या अधिक; GPU/VRAM भी जरूरी हो सकती है। असली जरूरत दस्तावेज़ में जाँचें।"
              if any(k in t for k in ["video editing", "video clip", "clipping", "blender", "3d", "animation"]):
                  return "🧠 RAM: अनुमान 8–16GB; वीडियो/प्रोजेक्ट बड़ा होने पर ज्यादा लग सकती है।"
              if any(k in t for k in ["browser", "web app", "dashboard", "automation", "agent", "mcp"]):
                  return "🧠 RAM: अनुमान 4–8GB; AI मॉडल चलाने पर ज्यादा लग सकती है।"
              return "🧠 RAM: जानकारी नहीं मिली; प्रोजेक्ट के निर्देश जाँचें।"

          gh_top = sorted(gh.values(), key=lambda x:x["stars"], reverse=True)[:6]
          # Inspect README for stated hardware requirements when accessible.
          for project in gh_top:
              project["hw_doc"] = "Not found in accessible README; estimate only"
              try:
                  owner, repo = project["name"].split("/", 1)
                  readme_url = "https://api.github.com/repos/" + owner + "/" + repo + "/readme"
                  rd = json.loads(fetch(readme_url, {"User-Agent":"OpportunityRadar","Accept":"application/vnd.github+json"}))
                  raw = base64.b64decode(rd.get("content", "")).decode("utf-8", errors="ignore")
                  lines = [clean(line) for line in raw.splitlines() if re.search(r"\b(ram|memory|vram|gpu|cuda|hardware|system requirements|minimum requirements|recommended requirements)\b", line, re.I)]
                  lines = [line for line in lines if line and len(line) < 300]
                  if lines:
                      project["hw_doc"] = "README में हार्डवेयर की जानकारी: " + " | ".join(hi(line) for line in lines[:3])
              except Exception:
                  pass

          hn_top = sorted(hn.values(), key=lambda x:x["points"], reverse=True)[:5]
          total_rss = sum(len(v) for v in rss.values())
          messages=[]
          summary = ("🔎 अवसर रडार\n📅 " + now.strftime("%d-%m-%Y %H:%M IST") + "\n🗓 पिछले 14 दिनों की सार्वजनिक खोज (जहाँ तारीख उपलब्ध है)\n\n"
                     + "🛠 GitHub प्रोजेक्ट: " + str(len(gh)) + " मिले\n📰 Hacker News चर्चाएँ: " + str(len(hn)) + " मिलीं\n🔎 खबर/ RSS संकेत: " + str(total_rss) + "\n\n"
                     + "स्रोत अधूरे हो सकते हैं। शीर्षक/एयरड्रॉप केवल खोज संकेत हैं—पुष्ट सलाह नहीं।")
          messages.append(summary)

          if gh_top:
              m="🛠 GitHub प्रोजेक्ट — सितारों के आधार पर (सुरक्षा रैंकिंग नहीं)\n\n"
              for r in gh_top:
                  use, steps, earning = project_use(r["name"] + " " + r["desc"])
                  desc_hi = hi(r["desc"]) if r["desc"] else "विवरण उपलब्ध नहीं। लिंक/README देखें।"
                  hw_hi = hi(r["hw_doc"]) if r["hw_doc"] else "हार्डवेयर की जानकारी नहीं मिली।"
                  m += ("📌 " + r["name"] + " | ⭐ " + str(r["stars"]) + "\n📅 बनाया: " + r["date"] + " | भाषा: " + r["lang"] + " | लाइसेंस: " + r["license"] + "\n"
                        + "📖 यह क्या है: " + desc_hi[:450] + "\n" + use + "\n" + steps + "\n" + earning + "\n"
                        + hw_hi[:350] + "\n" + ram_hint(r["name"]+" "+r["desc"]) + "\n🔗 असली लिंक: " + r["url"] + "\n\n")
              messages.append(m)
          if hn_top:
              m="📰 Hacker News — चर्चाओं के अंक के आधार पर\n\n"
              for r in hn_top:
                  m += ("🔹 " + hi(r["title"])[:220] + "\n📌 मूल शीर्षक: " + clean(r["title"])[:180] + "\n⬆️ अंक: " + str(r["points"]) + " | 💬 टिप्पणियाँ: " + str(r["comments"]) + "\n📝 यह केवल शीर्षक/चर्चा है; पूरा लेख खोलकर जाँचें।\n🔗 लेख: " + r["url"] + "\n🔗 चर्चा: " + r["discussion"] + "\n\n")
              messages.append(m)
          for category, entries in rss.items():
              if not entries: continue
              m=category + " — खबर/खोज संकेत (पहले पुष्टि करें)\n\n"
              for item in entries[:4]:
                  snippet = hi(item["desc"][:180]) if item.get("desc") else "अतिरिक्त विवरण उपलब्ध नहीं; लिंक खोलकर पढ़ें।"
                  m += ("🔸 " + hi(item["title"])[:230] + "\n📅 तारीख: " + (item["date"] or "तारीख उपलब्ध नहीं") + "\n📝 विवरण: " + snippet[:220] + "\n🔗 मूल लिंक: " + item["url"] + "\n\n")
              messages.append(m)
          if errors:
              m="⚠️ स्रोत में त्रुटि (बाकी स्रोत काम कर सकते हैं)\n\n"
              for e in errors[:8]: m += "• " + e + "\n"
              messages.append(m)
          messages.append("⚠️ सुरक्षा: एयरड्रॉप या कमाई की खबर से पैसा मिलने की पुष्टि नहीं होती। दावा करने के लिए पैसे न दें, Seed Phrase कभी साझा न करें, अनजान APK न डालें और संदिग्ध Wallet अनुमति न दें। X/Facebook/Instagram की जानकारी Login/API के बिना अधूरी हो सकती है; यहाँ सार्वजनिक खोज के संकेत हैं।")

          # Split at paragraph boundaries to stay under Telegram's message size limit.
          def send(text):
              chunks=[]; current=""
              for para in text.split("\n\n"):
                  piece=para+"\n\n"
                  if len(current)+len(piece)>3600 and current:
                      chunks.append(current); current=piece
                  else: current += piece
                  if len(current)>3600:
                      chunks.append(current[:3600]); current=current[3600:]
              if current.strip(): chunks.append(current)
              for chunk in chunks:
                  payload=json.dumps({"chat_id":CHAT,"text":chunk}).encode()
                  req=urllib.request.Request("https://api.telegram.org/bot"+TOKEN+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
                  response=json.loads(urllib.request.urlopen(req,timeout=30).read())
                  if not response.get("ok"): raise RuntimeError("Telegram send failed")
                  time.sleep(0.4)
          for msg in messages: send(msg)
          print("Radar finished. GitHub:",len(gh),"HN:",len(hn),"RSS leads:",total_rss,"Errors:",len(errors))
          PY
