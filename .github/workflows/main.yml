name: Opportunity Radar

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search public sources and send Telegram report
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          import datetime, email.utils, html, re, time, base64

          TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT = os.environ.get("CHAT_ID", "")
          if not TOKEN or not CHAT:
              raise RuntimeError("Telegram secrets missing: BOT_TOKEN or CHAT_ID")

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          since = now.date() - datetime.timedelta(days=14)
          errors, gh, hn, rss = [], {}, {}, {}
          translation_cache = {}
          translation_calls = 0

          def fetch(url, headers=None, timeout=25):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"OpportunityRadar/1.0"})
              return urllib.request.urlopen(req, timeout=timeout).read()

          def clean(s):
              return re.sub(r"\s+", " ", str(s or "")).strip()

          def hi(text):
              global translation_calls
              text = clean(text)
              if not text:
                  return "जानकारी उपलब्ध नहीं"
              if text in translation_cache:
                  return translation_cache[text]
              if translation_calls >= 90:
                  translation_cache[text] = text
                  return text
              translation_calls += 1
              try:
                  url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode({"client":"gtx","sl":"auto","tl":"hi","dt":"t","q":text[:900]})
                  data = json.loads(fetch(url, timeout=10))
                  translated = "".join(part[0] for part in data[0] if part and part[0])
                  translated = clean(translated) or text
              except Exception:
                  translated = text
              translation_cache[text] = translated
              return translated

          def rss_search(query, max_items=8):
              params = {"q":query,"hl":"en-IN","gl":"IN","ceid":"IN:en"}
              url = "https://news.google.com/rss/search?" + urllib.parse.urlencode(params)
              root = ET.fromstring(fetch(url))
              out=[]
              for item in root.findall(".//item"):
                  title = html.unescape(re.sub("<[^>]+>","",item.findtext("title", ""))).strip()
                  link = item.findtext("link", "").strip()
                  pub = item.findtext("pubDate", "")
                  if pub:
                      try:
                          pub_dt=email.utils.parsedate_to_datetime(pub)
                          if pub_dt.date() < since:
                              continue
                      except Exception:
                          pass
                  desc=html.unescape(re.sub("<[^>]+>"," ",item.findtext("description", ""))).strip()
                  if title and link:
                      out.append({"title":title,"url":link,"date":pub,"desc":desc[:500]})
                  if len(out)>=max_items: break
              return out

          # GitHub search: recent repositories across practical AI use cases
          gh_queries = ["AI video tools", "AI video clipping", "open source AI agent", "AI cartoon video", "AI automation"]
          for q in gh_queries:
              try:
                  query=q+" created:"+str(since)+".."+str(now.date())
                  url="https://api.github.com/search/repositories?"+urllib.parse.urlencode({"q":query,"sort":"stars","order":"desc","per_page":5})
                  data=json.loads(fetch(url,{"User-Agent":"OpportunityRadar","Accept":"application/vnd.github+json"}))
                  for r in data.get("items",[]):
                      link=r.get("html_url","")
                      desc=(r.get("description") or "").strip()
                      txt=(r.get("full_name","")+" "+desc).lower()
                      if any(w in txt for w in ["crack","keygen","pirated","torrent","fake download"]): continue
                      gh[link]={"name":r.get("full_name","?"),"stars":r.get("stargazers_count",0),"desc":desc,"url":link,"date":r.get("created_at","")[:10],"lang":r.get("language") or "Unknown","license":(r.get("license") or {}).get("spdx_id","Not specified")}
              except Exception as e:
                  errors.append("GitHub search: "+str(e)[:120])

          # Read accessible README and extract practical sections/requirements
          def readme_details(project):
              project["readme_steps"]="README में उपयोग/स्थापना के स्पष्ट निर्देश नहीं मिले; README लिंक खोलकर जाँचें।"
              project["hw_doc"]="हार्डवेयर की आधिकारिक जानकारी उपलब्ध README में नहीं मिली।"
              project["readme_url"]=""
              try:
                  owner,repo=project["name"].split("/",1)
                  api="https://api.github.com/repos/"+owner+"/"+repo+"/readme"
                  rd=json.loads(fetch(api,{"User-Agent":"OpportunityRadar","Accept":"application/vnd.github+json"}))
                  raw=base64.b64decode(rd.get("content","")).decode("utf-8",errors="ignore")
                  project["readme_url"]=rd.get("html_url",project["url"])
                  lines=raw.splitlines()
                  selected=[]; in_section=False; section_count=0
                  for line in lines:
                      if re.match(r"^#{1,3}\s+",line):
                          heading=line.lower()
                          if any(k in heading for k in ["install","setup","getting started","quick start","usage","requirements","hardware","prerequisite","features","run","download"]):
                              in_section=True; section_count=0
                              selected.append(line)
                          else:
                              in_section=False
                      elif in_section and line.strip():
                          selected.append(line)
                          section_count+=1
                          if section_count>=8: in_section=False
                      if len(selected)>=24: break
                  selected=[clean(x) for x in selected if clean(x) and not clean(x).startswith("<!--")]
                  if selected:
                      project["readme_steps"]=" | ".join(hi(x[:400]) for x in selected[:14])[:2200]
                  hw=[clean(x) for x in lines if re.search(r"\b(ram|memory|vram|gpu|cuda|hardware|system requirements|minimum requirements|recommended requirements)\b",x,re.I) and len(clean(x))<300]
                  if hw:
                      project["hw_doc"]="README में दी जानकारी: "+" | ".join(hi(x) for x in hw[:4])
              except Exception:
                  pass

          gh_top=sorted(gh.values(),key=lambda x:x["stars"],reverse=True)[:5]
          for p in gh_top: readme_details(p)

          # Hacker News discussions
          for q in ["AI video","AI tools","AI agent","open source AI","video clipping"]:
              try:
                  url="https://hn.algolia.com/api/v1/search_by_date?"+urllib.parse.urlencode({"query":q,"tags":"story","numericFilters":"created_at_i>"+str(int(datetime.datetime.combine(since,datetime.time(),tzinfo=IST).timestamp())),"hitsPerPage":10})
                  data=json.loads(fetch(url))
                  for h in data.get("hits",[]):
                      title=h.get("title") or ""
                      if not title: continue
                      link=h.get("url") or ("https://news.ycombinator.com/item?id="+h.get("objectID",""))
                      hn[h.get("objectID",link)]={"title":title,"points":h.get("points") or 0,"comments":h.get("num_comments") or 0,"url":link,"discussion":"https://news.ycombinator.com/item?id="+h.get("objectID","")}
              except Exception as e: errors.append("Hacker News: "+str(e)[:120])
          hn_top=sorted(hn.values(),key=lambda x:x["points"],reverse=True)[:4]

          # Airdrop leads: directory/quest sources + X search snippets. Only active-task keywords retained.
          airdrop_queries=[
              "site:airdrops.io new airdrop testnet points campaign",
              "site:galxe.com quest campaign points crypto",
              "site:layer3.xyz crypto quests campaign",
              "site:zealy.io crypto quest campaign",
              "site:questn.com testnet quest campaign",
              "site:x.com airdrop testnet points campaign official",
              "site:x.com crypto testnet quest points airdrop"
          ]
          airdrops=[]
          for q in airdrop_queries:
              try:
                  for item in rss_search(q,6):
                      title=item["title"].lower()
                      if not any(k in title for k in ["airdrop","testnet","points","quest","campaign","claim","reward"]): continue
                      if item["url"] not in [x["url"] for x in airdrops]:
                          item["search_query"]=q
                          airdrops.append(item)
              except Exception as e: errors.append("Airdrop search: "+str(e)[:100])
          airdrops=airdrops[:6]

          # X public-post discovery: search-indexed public posts only, not full X/API coverage.
          x_queries=[
              "site:x.com AI agent launch open source tool",
              "site:x.com new AI tool free launch",
              "site:x.com AI video cartoon tool launch",
              "site:x.com airdrop testnet points official",
              "site:x.com crypto campaign quest rewards",
              "site:x.com AI automation agent demo"
          ]
          x_items=[]
          for q in x_queries:
              try:
                  for item in rss_search(q,6):
                      if item["url"] not in [x["url"] for x in x_items]:
                          item["query"]=q
                          x_items.append(item)
              except Exception as e: errors.append("X public search: "+str(e)[:100])
          x_items=x_items[:8]

          # Other useful discovery sources (no crypto-news category)
          other_feeds={
              "🤖 नए AI टूल / प्रोजेक्ट":"new free AI tools OR open source AI project",
              "💵 ऑनलाइन काम / कमाई":"remote AI training jobs India OR Hindi data annotation jobs OR freelance remote work",
              "🎬 वीडियो / Reels प्रयोग":"Facebook Reels trends OR Instagram Reels trends OR YouTube Shorts trends",
              "🏪 भारत में छोटे व्यवसाय के अवसर":"AI services small business India OR online business opportunities India",
              "🌐 सार्वजनिक समुदायों के संकेत":"site:reddit.com AI tool launch OR site:news.ycombinator.com AI tools"
          }
          for category,q in other_feeds.items():
              try: rss[category]=rss_search(q,6)
              except Exception as e: errors.append(category+": "+str(e)[:100])

          # Categorize repository type for useful, non-generic use hints
          def project_use(text):
              t=text.lower()
              if any(k in t for k in ["clip","shorts","video editing","video editor"]): return "🎯 उपयोग: लंबी वीडियो से छोटे क्लिप बनाना या वीडियो एडिटिंग।"
              if any(k in t for k in ["cartoon","animation","blender","3d"]): return "🎯 उपयोग: कार्टून, एनीमेशन या 3D सामग्री बनाना।"
              if any(k in t for k in ["agent","mcp","automation","workflow"]): return "🎯 उपयोग: AI एजेंट, टूल जोड़ना या बार-बार होने वाला काम स्वचालित करना।"
              if any(k in t for k in ["voice","speech","tts","audio"]): return "🎯 उपयोग: आवाज़ बनाना, आवाज़ से लिखना या ऑडियो प्रक्रिया।"
              if any(k in t for k in ["image","photo","design"]): return "🎯 उपयोग: चित्र बनाना, बदलना या डिज़ाइन सहायता।"
              return "🎯 उपयोग: प्रोजेक्ट के README और Demo से सही उपयोग पहचानें।"

          def esc(s): return html.escape(str(s or ""),quote=True)
          def bold(s): return "<b>"+esc(s)+"</b>"
          def link(label,url): return '<a href="'+esc(url)+'">'+esc(label)+'</a>'
          def section(title,body): return bold(title)+"\n"+body

          messages=[]
          total_rss=sum(len(v) for v in rss.values())
          summary=("🔎 <b>अवसर रडार</b>\n📅 "+now.strftime("%d-%m-%Y %H:%M IST")+"\n🗓 पिछले 14 दिनों की खोज\n\n"
                  +"🧰 GitHub प्रोजेक्ट: "+str(len(gh))+"\n🪂 Airdrop संकेत: "+str(len(airdrops))+"\n𝕏 सार्वजनिक पोस्ट संकेत: "+str(len(x_items))+"\n💬 चर्चाएँ: "+str(len(hn))+"\n🔍 अन्य संकेत: "+str(total_rss)+"\n\n<i>ये खोज के संकेत हैं। हर प्रोजेक्ट/इनाम की आधिकारिक पुष्टि अलग से जाँचें।</i>")
          messages.append(summary)

          if gh_top:
              for p in gh_top:
                  desc=hi(p["desc"]) if p["desc"] else "विवरण नहीं दिया गया।"
                  m="🧰 <b>GitHub प्रोजेक्ट</b>\n\n"+bold(p["name"])+" ⭐ "+str(p["stars"])+"\n"
                  m+="📅 नया: "+esc(p["date"])+" | 💻 भाषा: "+esc(p["lang"])+" | 📜 लाइसेंस: "+esc(p["license"])+"\n\n"
                  m+=section("📖 यह क्या है?",esc(desc[:650]))+"\n\n"
                  m+=section("🎯 किस काम का?",esc(project_use(p["name"]+" "+p["desc"])))+"\n\n"
                  m+=section("🚀 स्थापना/इस्तेमाल",esc(p["readme_steps"]))+"\n\n"
                  m+=section("🖥️ हार्डवेयर",esc(p["hw_doc"]))+"\n\n"
                  m+="💡 <i>कमाई का तरीका: यदि यह उपयोगी सेवा बन सके, तो संबंधित काम ग्राहक को देकर कमाई संभव; निश्चित आय नहीं।</i>\n\n"
                  m+=link("🔗 GitHub प्रोजेक्ट",p["url"])
                  if p.get("readme_url"): m+="\n"+link("📚 README / निर्देश",p["readme_url"])
                  messages.append(m)

          if airdrops:
              m="🪂 <b>नए Airdrop / Testnet संकेत</b>\n\n<i>यह खोज परिणाम है—इनाम पक्का नहीं। आधिकारिक X/वेबसाइट पर Tasks, पात्रता और नियम जाँचें।</i>\n\n"
              for i,item in enumerate(airdrops,1):
                  m+=str(i)+". "+bold(hi(item["title"])[:220])+"\n"
                  if item.get("desc"): m+="📝 "+esc(hi(item["desc"][:300]))+"\n"
                  m+="🔗 "+link("खोज में मिला स्रोत खोलें",item["url"])+"\n\n"
              m+="⚠️ <i>इस रिपोर्ट में X अकाउंट/Discord/आधिकारिक Tasks लिंक तभी दिए जा सकते हैं जब खोज परिणामों में वास्तव में उपलब्ध हों। नकली लिंक नहीं जोड़े गए।</i>"
              messages.append(m)
          else:
              messages.append("🪂 <b>Airdrop / Testnet</b>\nआज खोज में कोई पर्याप्त परिणाम नहीं मिला।")

          if x_items:
              m="𝕏 <b>X पर सार्वजनिक पोस्ट संकेत</b>\n\n<i>यह X की पूरी खोज/सभी पोस्ट का विश्लेषण नहीं है; केवल खोज इंजन में उपलब्ध सार्वजनिक पोस्ट/पेज संकेत हैं।</i>\n\n"
              for item in x_items:
                  m+="🔹 "+bold(hi(item["title"])[:230])+"\n"
                  if item.get("desc"): m+="📝 "+esc(hi(item["desc"][:280]))+"\n"
                  m+="🔗 "+link("पोस्ट/स्रोत खोलें",item["url"])+"\n\n"
              messages.append(m)

          if hn_top:
              m="💬 <b>Hacker News चर्चाएँ</b>\n\n"
              for r in hn_top:
                  m+="🔹 "+bold(hi(r["title"])[:220])+"\n⬆️ अंक: "+str(r["points"])+" | 💬 टिप्पणियाँ: "+str(r["comments"])+"\n"
                  m+=link("लेख",r["url"])+" | "+link("चर्चा",r["discussion"])+"\n\n"
              messages.append(m)

          for category,entries in rss.items():
              if not entries: continue
              m=bold(category)+"\n\n"
              for item in entries[:4]:
                  m+="🔸 "+bold(hi(item["title"])[:220])+"\n"
                  if item.get("desc"): m+="📝 "+esc(hi(item["desc"][:220]))+"\n"
                  m+="🔗 "+link("स्रोत खोलें",item["url"])+"\n\n"
              messages.append(m)

          if errors:
              m="⚠️ <b>कुछ स्रोत नहीं खुले</b>\n\n"
              for e in errors[:8]: m+="• "+esc(e)+"\n"
              messages.append(m)
          messages.append("🛡️ <b>सुरक्षा</b>\nAirdrop के लिए पैसे जमा न करें। Seed Phrase/Private Key कभी न दें। अनजान APK न डालें और Wallet की अनजान अनुमति स्वीकार न करें। Points या Tasks का मतलब पक्का पैसा नहीं है।")

          def send(text):
              # Split Telegram HTML at paragraph boundaries; individual sections are kept small.
              chunks=[]; current=""
              for para in text.split("\n\n"):
                  piece=para+"\n\n"
                  if len(current)+len(piece)>3500 and current:
                      chunks.append(current); current=piece
                  else: current+=piece
              if current.strip(): chunks.append(current)
              for chunk in chunks:
                  payload=json.dumps({"chat_id":CHAT,"text":chunk,"parse_mode":"HTML","disable_web_page_preview":True}).encode()
                  req=urllib.request.Request("https://api.telegram.org/bot"+TOKEN+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
                  response=json.loads(urllib.request.urlopen(req,timeout=30).read())
                  if not response.get("ok"): raise RuntimeError("Telegram send failed: "+str(response))
                  time.sleep(0.4)
          for msg in messages: send(msg)
          print("Radar finished. GitHub:",len(gh),"Airdrop leads:",len(airdrops),"X public leads:",len(x_items),"HN:",len(hn),"RSS:",total_rss,"Errors:",len(errors))
          PY
