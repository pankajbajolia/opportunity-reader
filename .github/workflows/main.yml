8. स्रोत और खोज
══════════════════

जहाँ उपलब्ध हो, खोजो:

- GitHub
- Reddit
- Hacker News
- X की सार्वजनिक पोस्ट
- YouTube
- Instagram की सार्वजनिक जानकारी
- Facebook की सार्वजनिक जानकारी
- Product Hunt
- आधिकारिक AI Tool वेबसाइटें
- Open-source Communities
- आधिकारिक कंपनी Careers/Task Pages
- आधिकारिक Referral Pages
- आधिकारिक Airdrop/Testnet घोषणाएँ
- अन्य विश्वसनीय सार्वजनिक स्रोत

यदि किसी प्लेटफॉर्म तक पहुँच नहीं है या API/बंदी के कारण खोज संभव नहीं है, तो साफ लिखो:
"इस स्रोत की खोज इस बार उपलब्ध नहीं थी।"

किसी स्रोत को खोजे बिना ऐसा दावा मत करना कि वहाँ 24 घंटे निगरानी की गई।

══════════════════
9. सभी परिणामों की रिपोर्ट
══════════════════

यदि खोज में 25 वास्तविक परिणाम मिले तो 25 के 25 परिणामों की मूल लिंक उपलब्ध कराओ।

जानकारी को प्राथमिकता के अनुसार व्यवस्थित करो:

🔴 सबसे उपयोगी और तुरंत आजमाने योग्य
🟠 अच्छा अवसर लेकिन जाँच/सीखने की जरूरत
🟡 भविष्य के लिए उपयोगी
⚪ केवल जानकारी/कम प्राथमिकता

किसी परिणाम को केवल Stars, Views, Likes या Points के आधार पर सर्वश्रेष्ठ मत बताओ।

प्रत्येक परिणाम का:
- वास्तविक नाम।
- मूल लिंक।
- स्रोत।
- खोज/प्रकाशन की तारीख।
- संक्षिप्त विवरण।
- किस श्रेणी का है।
- मुफ्त/भुगतान स्थिति।
- डिवाइस अनुकूलता।
- RAM/Hardware आवश्यकता।
- कमाई/उपयोग की संभावना।
- जोखिम।
- मेरी प्राथमिकता के अनुसार रैंक।

हर परिणाम की लिंक उसी मूल स्रोत की हो।
किसी वेबसाइट का नाम देखकर नकली लिंक मत बनाओ।

══════════════════
10. Telegram रिपोर्ट का प्रारूप
══════════════════

Telegram पर हर 4 घंटे रिपोर्ट भेजो।

पहले संदेश में:

🔎 OPPORTUNITY RADAR
📅 तारीख और समय
🔍 आज खोजे गए स्रोत
📊 कुल परिणाम
🔥 आज के Top 3 अवसर

हर Top 3 के लिए:
नाम:
यह क्या है:
मुफ्त/खर्च:
मोबाइल/PC:
RAM:
मेरे लिए क्यों उपयोगी:
कमाई की संभावना:
शुरुआत कैसे करें:
मूल लिंक:
जोखिम:

फिर बाकी सभी परिणामों की क्रमांकित सूची भेजो।
हर परिणाम की मूल लिंक अनिवार्य हो।

यदि जानकारी अधिक हो तो Telegram के कई संदेश भेजो।
एक संदेश की सीमा से अधिक जानकारी काटो मत।
25 परिणाम हों तो 25 की सूची पूरी भेजो।
हर प्रोजेक्ट की विस्तृत जानकारी जरूरत के अनुसार अलग संदेशों में भेजो।

अंत में:

📌 आज मेरे लिए सबसे अच्छा काम:
उस अवसर को चुनो जिसे मैं अभी मुफ्त में शुरू कर सकता हूँ।

और उसके:
1. कहाँ जाना है?
2. कौन-सी वेबसाइट/App खोलनी है?
3. क्या करना है?
4. अगला चरण क्या?
5. किस चीज की जरूरत होगी?

आसान हिंदी में समझाओ।

══════════════════
11. सत्यता और सुरक्षा
══════════════════

- कोई Fake Earning नहीं।
- कोई Guaranteed Income नहीं।
- कोई नकली Viral दावा नहीं।
- कोई Paid Course नहीं।
- कोई अनिवार्य निवेश नहीं।
- कोई Deposit Task नहीं।
- कोई नकली नौकरी नहीं।
- कोई Pirated Software नहीं।
- कोई Malware/संदिग्ध APK नहीं।
- कोई फर्जी Referral नहीं।
- कोई Scam Crypto Project नहीं।
- बिना प्रमाण Free न लिखो।
- बिना प्रमाण Hardware Requirements न लिखो।
- बिना प्रमाण भारत में उपलब्ध न लिखो।
- बिना प्रमाण पैसे मिलने का दावा न करो।
- असली स्रोत से जानकारी जाँचो।
- जानकारी पुरानी हो तो तारीख बताओ।
- कोई जानकारी उपलब्ध न हो तो "पुष्टि नहीं हुई" लिखो।
- प्रत्येक अवसर में जोखिम स्पष्ट बताओ।

मेरी प्राथमिकता:
ऐसा अवसर जो आज मुफ्त में शुरू किया जा सके, भारत में उपलब्ध हो, मोबाइल या मेरे 6 GB RAM लैपटॉप पर चल सके, सीखने में आसान हो, और वास्तविक उपयोग या कमाई की संभावना रखता हो।

मुझे केवल खबरें नहीं चाहिए।
मुझे ऐसे अवसर चाहिए जिनके बारे में पढ़कर मैं वास्तव में कुछ शुरू कर सकूँ।
