name: Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: खोज, हिंदी रिपोर्ट और Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, re, json, time, html, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from xml.etree import ElementTree as ET

          BOT = os.environ["BOT_TOKEN"]
          CHAT = os.environ["CHAT_ID"]
          NOW = datetime.now(timezone.utc)
          IST = timezone(timedelta(hours=5, minutes=30))
          stamp = NOW.astimezone(IST).strftime("%d-%m-%Y %I:%M %p")
          errors = []

          def fetch(url, headers=None, timeout=18):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"OpportunityRadar/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def translate(text):
              text = (text or "").strip()
              if not text: return ""
              # छोटा-छोटा अनुवाद; विफल होने पर मूल भाषा स्पष्ट रूप से चिह्नित।
              chunks = [text[i:i+850] for i in range(0, min(len(text), 3000), 850)]
              out = []
              for chunk in chunks:
                  try:
                      url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=hi&dt=t&q=" + urllib.parse.quote(chunk)
                      data = json.loads(fetch(url, timeout=12))
                      out.append("".join(x[0] for x in data[0] if x and x[0]))
                      time.sleep(.15)
                  except Exception:
                      out.append("मूल भाषा: " + chunk)
              return " ".join(out)

          def rss(query, limit=6):
              url = "https://news.google.com/rss/search?q=" + urllib.parse.quote(query) + "&hl=en-IN&gl=IN&ceid=IN:en"
              try:
                  root = ET.fromstring(fetch(url))
                  items = []
                  for it in root.findall(".//item")[:limit]:
                      title = (it.findtext("title") or "").strip()
                      link = (it.findtext("link") or "").strip()
                      desc = re.sub("<[^>]+>", " ", it.findtext("description") or "")
                      desc = html.unescape(re.sub(r"\s+", " ", desc)).strip()
                      pub = it.findtext("pubDate") or ""
                      items.append({"title":title, "link":link, "desc":desc, "date":pub})
                  return items
              except Exception as e:
                  errors.append("RSS: " + str(e)[:140])
                  return []

          def gh_search(q, n=5):
              url = "https://api.github.com/search/repositories?q=" + urllib.parse.quote(q) + "&sort=updated&order=desc&per_page=" + str(n)
              try:
                  data = json.loads(fetch(url, {"Accept":"application/vnd.github+json","User-Agent":"OpportunityRadar"}))
                  return data.get("items", [])
              except Exception as e:
                  errors.append("GitHub: " + str(e)[:140])
                  return []

          def get_readme(repo):
              try:
                  url = repo.get("html_url","").replace("github.com/","raw.githubusercontent.com/") + "/HEAD/README.md"
                  # Use GitHub API default branch rather than HEAD raw URL.
                  branch = repo.get("default_branch") or "main"
                  url = f"https://raw.githubusercontent.com/{repo['full_name']}/{branch}/README.md"
                  return fetch(url).decode("utf-8","replace")[:16000]
              except Exception:
                  return ""

          def readme_extract(md):
              md = re.sub(r"!\[[^\]]*\]\([^)]+\)", "", md)
              md = re.sub(r"<[^>]+>", " ", md)
              md = re.sub(r"`{1,3}", "", md)
              md = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", md)
              lines = [re.sub(r"\s+"," ",x).strip() for x in md.splitlines()]
              keys = ("install","installation","quick start","getting started","setup","usage","run","requirements","prerequisites","hardware","features","windows","linux","macos","docker","pip","npm","uv","first")
              selected=[]
              for i,line in enumerate(lines):
                  if line and any(k in line.lower() for k in keys):
                      for j in range(i, min(i+5,len(lines))):
                          if lines[j] and lines[j] not in selected:
                              selected.append(lines[j])
              if not selected:
                  selected=[x for x in lines[:30] if x]
              # limit, remove repetitive junk
              return " ".join(selected[:18])[:2200]

          def when(pub):
              try:
                  dt=parsedate_to_datetime(pub).astimezone(IST)
                  return dt.strftime("%d %b")
              except Exception: return "तिथि उपलब्ध नहीं"

          def source_link(item):
              link=item["link"]
              # Google News RSS links often redirect; preserve link if cannot resolve.
              try:
                  req=urllib.request.Request(link, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      final=r.geturl()
                  return final
              except Exception:
                  return link

          # GitHub project खोज: अलग-अलग श्रेणियाँ, डुप्लिकेट हटाएँ
          queries=[
            "AI video clipping shorts open source",
            "AI agent automation tools open source",
            "AI cartoon animation video open source",
            "local AI agent desktop browser open source",
            "Blender AI addon MCP open source",
            "AI tools workflow automation open source"
          ]
          repos={}
          for q in queries:
              for r in gh_search(q,4):
                  repos[r["full_name"]]=r
          recent=[]
          cutoff=NOW-timedelta(days=21)
          for r in repos.values():
              try:
                  dt=datetime.fromisoformat(r["updated_at"].replace("Z","+00:00"))
                  if dt>=cutoff and not r.get("archived"): recent.append(r)
              except: pass
          recent.sort(key=lambda r:(r.get("stargazers_count",0),r.get("updated_at","")), reverse=True)
          recent=recent[:5]

          def project_card(r):
              readme=get_readme(r)
              extract=readme_extract(readme)
              desc=translate(r.get("description") or "विवरण उपलब्ध नहीं")
              setup=translate(extract) if extract else "README से शुरुआती निर्देश नहीं मिले।"
              lic=(r.get("license") or {}).get("spdx_id") or "लाइसेंस की पुष्टि नहीं"
              lang=r.get("language") or "भाषा जानकारी नहीं"
              stars=r.get("stargazers_count",0)
              updated=r.get("updated_at","")[:10]
              topics=", ".join(r.get("topics",[])[:5]) or "टॉपिक नहीं दिए"
              # source clues, not a hardware benchmark
              text=(readme+" "+r.get("description","")).lower()
              hardware=[]
              if any(x in text for x in ["gpu","cuda","nvidia","vram"]): hardware.append("GPU/VRAM का उल्लेख है; सटीक जरूरत README में जाँचें")
              if any(x in text for x in ["local model","ollama","llama.cpp","local inference"]): hardware.append("स्थानीय AI मॉडल; RAM/GPU की जरूरत मॉडल के आकार पर निर्भर")
              if any(x in text for x in ["docker","docker compose"]): hardware.append("Docker की जरूरत/विकल्प का उल्लेख")
              if any(x in text for x in ["api key","api keys","bring your own key"]): hardware.append("संभवतः API key/भुगतान वाला मॉडल लग सकता है")
              if any(x in text for x in ["free","open source"]): hardware.append("ओपन-सोर्स; सभी AI सेवाएँ जरूरी नहीं कि मुफ्त हों")
              if not hardware: hardware=["हार्डवेयर/खर्च की स्पष्ट जानकारी नहीं मिली"]
              return (f"🧰 <b>{html.escape(r['full_name'])}</b> ⭐ {stars:,}\n"
                f"📅 अपडेट: {updated} | 💻 {html.escape(lang)} | 📜 {html.escape(lic)}\n"
                f"📖 <b>क्या करता है:</b> {html.escape(desc[:650])}\n"
                f"🎯 <b>कहाँ काम आ सकता है:</b> {html.escape(translate(topics))}\n"
                f"🖥️ <b>कंप्यूटर/खर्च संकेत:</b> {html.escape(' • '.join(hardware))}\n"
                f"🚀 <b>README से मिले शुरुआती निर्देश (सार/अनुवाद):</b>\n{html.escape(setup[:1100])}\n"
                f"🔗 <a href='{html.escape(r['html_url'], quote=True)}'>GitHub खोलें</a>\n")

          # X indexed post clues: restrict results to direct X links; no claim of full X access.
          x_queries=[
            'site:x.com ("AI agent" OR "AI tool") ("open source" OR released OR launch)',
            'site:x.com ("AI video" OR cartoon OR animation) tool',
            'site:x.com (airdrop OR testnet OR points) official',
            'site:x.com ("earn" OR opportunity OR "creator tool") AI'
          ]
          xitems=[]
          for q in x_queries:
              for item in rss(q,5):
                  final=source_link(item)
                  if re.search(r"https?://(www\.)?(x\.com|twitter\.com)/",final):
                      item["link"]=final
                      if item["title"] not in [x["title"] for x in xitems]:
                          xitems.append(item)
          # Airdrops: only search indexed X posts, discard directory/blog/news results.
          air=[]
          for item in rss('site:x.com (airdrop OR testnet OR points) (official OR campaign OR tasks)',10):
              final=source_link(item)
              if re.search(r"https?://(www\.)?(x\.com|twitter\.com)/",final) and item["title"] not in [x["title"] for x in air]:
                  item["link"]=final
                  air.append(item)
          xitems=xitems[:6]
          air=air[:5]

          # Other non-crypto opportunities/tools; news is presented as a lead, not a confirmed job.
          other=[]
          for q in [
            '"free AI tool" launch OR released',
            '"open source" AI automation tool recently',
            'India remote freelance opportunity AI creator tool'
          ]:
              other.extend(rss(q,3))
          unique=[]
          for it in other:
              if it["title"] not in [x["title"] for x in unique]: unique.append(it)
          other=unique[:5]

          def format_item(item, prefix="🔹"):
              title=translate(item["title"])
              desc=translate(item.get("desc",""))[:420]
              link=item.get("link","")
              date=when(item.get("date",""))
              return f"{prefix} <b>{html.escape(title[:300])}</b>\n🗓️ {date}\n{html.escape(desc)}\n🔗 <a href='{html.escape(link,quote=True)}'>मूल स्रोत खोलें</a>"

          messages=[]
          messages.append(f"🔎 <b>OPPORTUNITY RADAR</b>\n📅 {stamp}\n🕵️ पिछले 21 दिनों के अपडेट/खोज संकेत\n━━━━━━━━━━━━━━━━━━")

          messages.append("🧰 <b>काम के GitHub प्रोजेक्ट</b>\n<i>README निर्देशों का अनुवादित सार है; लिंक खोलकर मूल निर्देश और सुरक्षा जाँचें।</i>")
          if recent:
              messages.extend(project_card(r) for r in recent)
          else: messages.append("इस रन में नए/हाल में अपडेट प्रोजेक्ट नहीं मिले।")

          messages.append("𝕏 <b>X पर सार्वजनिक पोस्ट संकेत</b>\n<i>यह पूर्ण X खोज नहीं है। केवल खोज इंजन में मिले सीधे X लिंक; पोस्ट/लिंक की पूर्ण जाँच उपलब्ध नहीं।</i>")
          if xitems:
              messages.extend(format_item(x) for x in xitems)
          else: messages.append("इस रन में सीधे X लिंक वाला परिणाम नहीं मिला।")

          messages.append("🪂 <b>Airdrop/Testnet — केवल X पोस्ट संकेत</b>\n<i>Airdrops.io/ब्लॉग/समाचार हटाए गए। कोई इनाम पक्का नहीं; पोस्ट/आधिकारिक साइट/Tasks की अलग पुष्टि करें। Seed phrase या पैसे न दें।</i>")
          if air:
              messages.extend(format_item(x,"🪂") for x in air)
              messages.append("⚠️ इस रिपोर्ट में task steps तभी दिए जा सकते हैं जब स्रोत में स्पष्ट रूप से उपलब्ध हों; अभी केवल खोज-संकेत हैं, पात्रता/टास्क सत्यापित नहीं।")
          else: messages.append("सीधे X लिंक वाला airdrop/testnet परिणाम नहीं मिला।")

          messages.append("💡 <b>अन्य टूल/अवसर संकेत</b>\n<i>ये खोज परिणाम हैं, नौकरी/कमाई की पुष्टि नहीं। आवेदन/खरीद से पहले स्रोत जाँचें।</i>")
          if other:
              messages.extend(format_item(x) for x in other)
          else: messages.append("इस रन में परिणाम नहीं मिले।")

          if errors:
              messages.append("⚠️ <b>कुछ खोज स्रोत विफल:</b>\n"+html.escape(" • ".join(errors[:4])))
          messages.append("━━━━━━━━━━━━━━━━━━\n🔐 सुरक्षा: अज्ञात वेबसाइट पर पैसे, OTP, पासवर्ड या Seed Phrase न दें।\n<i>रिपोर्ट स्वचालित है; हर जानकारी स्वयं सत्यापित करें।</i>")

          # Telegram HTML, chunk on paragraph boundaries; keep each message under safe limit.
          def send(text):
              api=f"https://api.telegram.org/bot{BOT}/sendMessage"
              payload={"chat_id":CHAT,"text":text,"parse_mode":"HTML","disable_web_page_preview":True}
              data=urllib.parse.urlencode(payload).encode()
              req=urllib.request.Request(api,data=data)
              with urllib.request.urlopen(req,timeout=25) as res:
                  body=json.loads(res.read())
                  if not body.get("ok"): raise RuntimeError(str(body)[:250])
          chunks=[]
          current=""
          for block in messages:
              if len(current)+len(block)+2>3800:
                  if current: chunks.append(current); current=""
              if len(block)>3800:
                  block=block[:3700]+"…"
              current += ("\n\n" if current else "")+block
          if current: chunks.append(current)
          for chunk in chunks:
              send(chunk)
              time.sleep(1)
          print("Sent",len(chunks),"Telegram messages.")
          PY
